name: Build and Release Android Remote (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 提取 Release Notes (修复标题级别匹配问题)
      - name: Extract Release Notes
        id: extract_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'CHANGELOG.md';
            
            if (!fs.existsSync(path)) {
              core.setOutput('notes', 'No CHANGELOG.md found.');
              return;
            }

            const changelog = fs.readFileSync(path, 'utf8');
            const tag = context.ref.replace('refs/tags/', ''); 
            const tagWithoutV = tag.replace(/^v/, '');       
            
            console.log(`Target Tag: ${tag}`);
            
            const lines = changelog.split(/\r?\n/);
            let releaseNotes = [];
            let startCollecting = false;

            for (const line of lines) {
              const trimmed = line.trim();
              
              // 【关键修复】：仅匹配二级标题 (## )，不匹配三级标题 (###)
              // 正则含义：以两个#开头，后面必须跟一个空格
              const isVersionHeader = /^##\s/.test(trimmed);

              if (isVersionHeader) {
                if (startCollecting) {
                  // 如果已经在收集，遇到下一个“二级标题”才停止
                  console.log(`Found next version header: ${line}, stopping.`);
                  break;
                }
                
                // 检查当前二级标题是否包含目标版本号
                if (trimmed.includes(tag) || trimmed.includes(tagWithoutV)) {
                  console.log(`✅ Matched header: ${line}`);
                  startCollecting = true;
                  continue; 
                }
              }

              if (startCollecting) {
                releaseNotes.push(line);
              }
            }

            const finalNotes = releaseNotes.join('\n').trim();
            
            if (finalNotes) {
              console.log('Successfully extracted content.');
              core.setOutput('notes', finalNotes);
            } else {
              console.log('❌ Content is empty after matching header.');
              core.setOutput('notes', `Android Remote CLI ${tag} 发布，详情请查看 CHANGELOG.md。`);
            }

      # 3. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 4. 安装并构建
      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          PKG_CACHE_PATH: ${{ github.workspace }}/.pkg-cache # 显式指定环境变量
          CI: true

      # 5. 发布 Release
      - name: Create Release & Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Remote CLI ${{ github.ref_name }}
          body: ${{ steps.extract_notes.outputs.notes }}
          files: |
            dist/*.exe
          draft: false
          prerelease: false