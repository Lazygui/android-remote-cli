name: Build and Release Android Remote (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 提取 Release Notes (改用更稳健的逐行扫描算法)
      - name: Extract Release Notes
        id: extract_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'CHANGELOG.md';
            
            if (!fs.existsSync(path)) {
              core.setOutput('notes', 'No CHANGELOG.md found.');
              return;
            }

            const changelog = fs.readFileSync(path, 'utf8');
            const tag = context.ref.replace('refs/tags/', ''); // 例如 v1.0.0
            const tagWithoutV = tag.replace(/^v/, '');       // 例如 1.0.0
            
            console.log(`Target Tag: ${tag}`);
            
            // 将文件按行切分，兼容 Windows(\r\n) 和 Linux(\n)
            const lines = changelog.split(/\r?\n/);
            let releaseNotes = [];
            let startCollecting = false;

            for (const line of lines) {
              // 检查是否是二级标题行 (##)
              if (line.trim().startsWith('##')) {
                if (startCollecting) {
                  // 如果已经在收集内容，遇到下一个标题就停止
                  break;
                }
                // 检查标题行是否包含 v1.0.0 或 1.0.0
                if (line.includes(tag) || line.includes(tagWithoutV)) {
                  console.log(`Found header: ${line}`);
                  startCollecting = true;
                  continue; // 跳过标题行本身
                }
              }

              if (startCollecting) {
                releaseNotes.push(line);
              }
            }

            const finalNotes = releaseNotes.join('\n').trim();
            
            if (finalNotes) {
              console.log('Successfully extracted notes.');
              core.setOutput('notes', finalNotes);
            } else {
              console.log('Failed to find matching section.');
              // 备选方案：如果没找到，就返回一个默认的通知
              core.setOutput('notes', `Android Remote CLI ${tag} 发布，详情请查看 CHANGELOG.md。`);
            }

      # 3. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 4. 安装依赖并执行构建脚本
      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          CI: true 

      # 5. 发布 Release
      - name: Create Release & Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Remote CLI ${{ github.ref_name }}
          body: ${{ steps.extract_notes.outputs.notes }}
          files: |
            dist/*.exe
          draft: false
          prerelease: false