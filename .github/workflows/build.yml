name: Build and Release Android Remote (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. [核心步骤] 从 CHANGELOG.md 中提取当前版本的说明
      - name: Get notes from Changelog
        id: generate_notes
        uses: anmarkoulis/commitizen-changelog-reader@master
        with:
          tag_name: ${{ github.ref }}
          changelog: CHANGELOG.md

      # 3. 设置 Node 环境并构建项目
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          CI: true

      # 4. 发布 Release
      - name: Create Release & Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Remote CLI ${{ github.ref_name }}
          # 【关键点】该插件返回的是 JSON 格式，需要用 join 函数转回字符串
          body: ${{ join(fromJson(steps.generate_notes.outputs.notes).notes, '') }}
          files: |
            dist/*.exe
          draft: false
          prerelease: false