name: Build and Release Android Remote (Windows)

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的标签时触发，如 v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以确保能读取到所有内容

      # 2. 提取 Release Notes (增强版脚本)
      # 该脚本会自动去 CHANGELOG.md 中匹配当前 Tag 的内容，忽略日期后缀
      - name: Extract Release Notes
        id: extract_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'CHANGELOG.md';
            if (!fs.existsSync(path)) {
              core.setOutput('notes', 'No CHANGELOG.md found.');
              return;
            }
            const changelog = fs.readFileSync(path, 'utf8');
            const tag = context.ref.replace('refs/tags/', '');
            
            // 转义标签中的点，防止正则误判
            const escapedTag = tag.replace(/\./g, '\\.');
            
            // 正则说明：
            // ## .*?v1\.0\.0.*? 匹配包含版本号的二级标题行（支持后面跟日期）
            // ([\s\S]*?) 抓取随后的内容
            // (?=\r?\n## |\z) 在遇到下一个二级标题或文件结束时停止
            const regex = new RegExp(`## .*?${escapedTag}.*?(\\r?\\n)([\\s\\S]*?)(?=\\r?\\n## |\\z)`, 'i');
            const result = changelog.match(regex);
            
            if (result && result[2]) {
              const notes = result[2].trim();
              console.log('✅ 成功提取更新日志：\n', notes);
              core.setOutput('notes', notes);
            } else {
              console.log('❌ 正则匹配失败，标签：', tag);
              core.setOutput('notes', `Release notes for ${tag} not found in CHANGELOG.md. Please ensure the header format is "## ${tag}".`);
            }

      # 3. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 4. 安装依赖并执行构建脚本
      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          # CI 环境变量会告知 build.js 使用官方下载源，不走国内镜像
          CI: true 

      # 5. 检查构建产物
      - name: Check artifacts
        run: dir dist

      # 6. 发布 Release 到 GitHub
      - name: Create Release & Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Remote CLI ${{ github.ref_name }}
          # 动态填入从 CHANGELOG.md 中提取的内容
          body: ${{ steps.extract_notes.outputs.notes }}
          files: |
            dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: false # 设为 false，因为我们已经自己提供了 body